name: Fetch paper contexts

# Manual, and deliberately slow. Walks the paper candidates, finds an openly
# readable copy of each, and extracts the passages where the work cites Codon or
# Seq into data/paper-contexts.json.
#
# The pacing is generous on purpose: a 429 partway through can poison a run of
# requests to a host, and OpenAlex bills against a daily allowance that the
# curation work then needs. At the defaults the job takes roughly 45 minutes per
# 100 papers, which is well inside the timeout.
#
# Resumable, and it checkpoints after every paper. Works already recorded, and
# works already marked blocked, are skipped, so re-running picks up where it
# stopped. It makes no judgement -- codon_relation is set by a person reading the
# extracts, as ruling 8 requires.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many new works to attempt this run (blank = all remaining)'
        required: false
        default: ''
      mode:
        description: 'normal = fetch what is missing; retry-blocked = also re-attempt past blocks; refetch = redo everything (use after an extraction change)'
        required: false
        type: choice
        options: ['normal', 'retry-blocked', 'refetch']
        default: 'normal'
      pace_work:
        description: 'Seconds to wait between papers'
        required: false
        default: '20'
      pace_host:
        description: 'Minimum seconds between two requests to the same host'
        required: false
        default: '12'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PACE_WORK: ${{ inputs.pace_work }}
      PACE_HOST: ${{ inputs.pace_host }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pypdf
        run: pip install --quiet pypdf

      - name: Harvest the candidate list if it is missing
        run: |
          if [ ! -f data/papers-candidates.json ]; then
            python3 harvest/citations.py --write
          fi

      - name: Fetch full texts and extract citation contexts
        run: |
          FLAGS="--write"
          case "${{ inputs.mode }}" in
            retry-blocked) FLAGS="$FLAGS --retry-blocked" ;;
            refetch)       FLAGS="$FLAGS --refetch" ;;
          esac
          if [ -n "${{ inputs.limit }}" ]; then
            FLAGS="$FLAGS --limit ${{ inputs.limit }}"
          fi
          echo "running: python3 -u harvest/fetch_contexts.py $FLAGS"
          python3 -u harvest/fetch_contexts.py $FLAGS

      - name: Commit whatever was gathered
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper-contexts.json data/papers-candidates.json || true
          if ! git diff --cached --quiet; then
            git commit -m "CI: fetch paper citation contexts (${{ inputs.mode }})"
            git pull --rebase
            git push
          else
            echo "nothing new gathered"
          fi
